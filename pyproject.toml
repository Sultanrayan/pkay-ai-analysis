[project]
name = "trading-analysis-bot"
version = "0.1.0"
description = "Telegram trading analysis bot for BTCUSD & XAUUSD with a multi-agent architecture"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "python-telegram-bot>=21.0,<23.0",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "redis>=5.0",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "ISC"]
# RUF012: read-only class-level constant dicts (provider symbol maps etc.)
# are intentional; they are never mutated at runtime.
ignore = ["RUF012"]
