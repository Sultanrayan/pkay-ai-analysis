[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-analysis-bot"
version = "3.0.0"
description = "Telegram multi-asset trading analysis bot (BTCUSDT/ETHUSDT/SOLUSDT/XAUUSD) with 10 AI agents and DeepSeek-V4-Flash enrichment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sultanrayan", email = "errorkruzer1@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
urls = { Homepage = "https://github.com/Sultanrayan/pkay-ai-analysis", Repository = "https://github.com/Sultanrayan/pkay-ai-analysis" }
dependencies = [
    "python-telegram-bot>=21.0,<23.0",
    "aiohttp>=3.9",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "redis>=5.0",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
]

# Ship the SQL schema (used by scripts/init_db.py and the Postgres storage
# backend) inside the package so installed wheels work out of the box.
[tool.setuptools.package-data]
"tradingbot.storage" = ["schema.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "ISC"]
# RUF012: read-only class-level constant dicts (provider symbol maps etc.)
# are intentional; they are never mutated at runtime.
ignore = ["RUF012"]
